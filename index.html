<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butter Ball Wave Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-overlay">
            <h1>Butter Ball Wave Test</h1>
            <p>Click or press <strong>SPACE</strong> to fire a directional wave burst.</p>
            <div id="controls">
                <label>Arc Angle: <span id="arcVal">35</span>°</label>
                <input type="range" id="arcSlider" min="30" max="45" value="35">
                
                <label>Balls per Wave: <span id="countVal">8</span></label>
                <input type="range" id="countSlider" min="3" max="20" value="8">
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
